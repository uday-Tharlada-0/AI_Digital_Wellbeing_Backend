<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account | AI Digital Wellbeing</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center px-5 py-10"
  >
    <main class="w-full max-w-md">
      <div class="mb-8 text-center">
        <div
          class="mx-auto mb-4 h-12 w-12 rounded-2xl bg-blue-500 flex items-center justify-center text-2xl font-bold"
        >
          +
        </div>
        <h1 class="text-3xl font-bold tracking-tight">Create your account</h1>
        <p class="mt-2 text-sm text-slate-400">
          Your personal wellbeing data starts here.
        </p>
      </div>

      <form
        method="post"
        action="{{ url_for('auth.register') }}"
        class="rounded-2xl border border-white/10 bg-white/[.06] p-6 shadow-2xl"
      >
        {% if error %}
        <div
          class="mb-5 rounded-xl border border-red-400/30 bg-red-400/10 px-4 py-3 text-sm text-red-200"
        >
          {{ error }}
        </div>
        {% endif %}

        <label class="block text-sm font-medium text-slate-300" for="name"
          >Full name</label
        >
        <input
          id="name"
          name="name"
          type="text"
          autocomplete="name"
          required
          autofocus
          class="mt-2 w-full rounded-xl border border-white/10 bg-slate-900 px-4 py-3 text-sm outline-none focus:border-blue-400"
          placeholder="Your name"
        />

        <label
          class="mt-4 block text-sm font-medium text-slate-300"
          for="username"
          >Username</label
        >
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
          class="mt-2 w-full rounded-xl border border-white/10 bg-slate-900 px-4 py-3 text-sm outline-none focus:border-blue-400"
          placeholder="Choose a username"
        />

        <label class="mt-4 block text-sm font-medium text-slate-300" for="email"
          >Email address</label
        >
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
          class="mt-2 w-full rounded-xl border border-white/10 bg-slate-900 px-4 py-3 text-sm outline-none focus:border-blue-400"
          placeholder="you@example.com"
        />

        <label
          class="mt-4 block text-sm font-medium text-slate-300"
          for="password"
          >Password</label
        >
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
          class="mt-2 w-full rounded-xl border border-white/10 bg-slate-900 px-4 py-3 text-sm outline-none focus:border-blue-400"
          placeholder="At least 8 characters"
        />

        <label
          class="mt-4 block text-sm font-medium text-slate-300"
          for="confirm_password"
          >Confirm password</label
        >
        <input
          id="confirm_password"
          name="confirm_password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
          class="mt-2 w-full rounded-xl border border-white/10 bg-slate-900 px-4 py-3 text-sm outline-none focus:border-blue-400"
          placeholder="Repeat your password"
        />

        <button
          type="submit"
          class="mt-6 w-full rounded-xl bg-blue-500 px-4 py-3 text-sm font-semibold text-white transition hover:bg-blue-400"
        >
          Create account
        </button>
        <p class="mt-5 text-center text-sm text-slate-400">
          Already have an account?
          <a
            class="font-semibold text-blue-300 hover:text-blue-200"
            href="{{ url_for('auth.login') }}"
            >Sign in</a
          >
        </p>
      </form>
    </main>
  </body>
</html>
